# fly.toml app configuration file generated for qadha-game on 2026-04-12T23:25:32+04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'qadha-game'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  QADHA_SERVER_PORT = '3001'
  QADHA_TRUST_PROXY = '1'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
