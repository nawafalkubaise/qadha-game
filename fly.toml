# Fly.io — بعد تثبيت flyctl: fly launch --no-deploy ثم fly secrets set QADHA_ADMIN_KEY=...
# ثم: fly deploy
# غيّر اسم التطبيق أدناه أو احذف السطر ليختار fly اسمًا جديدًا.

app = "qadha-game"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[env]
  NODE_ENV = "production"
  QADHA_SERVER_PORT = "3001"
  QADHA_TRUST_PROXY = "1"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
